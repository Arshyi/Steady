name: steady_unoq
description: "Steady wearable - MPU6050 accelerometer and gyroscope, fall detection on the MCU, WebSocket feed and server relay for the dashboard"
icon: "📡"
version: "1.1.0"
# Publish the relay on the board's Wi-Fi address so the dashboard can connect
# over the network instead of USB serial. Without this the container listens on
# 8765 privately and nothing outside Docker can reach it.
ports:
  - 8765
