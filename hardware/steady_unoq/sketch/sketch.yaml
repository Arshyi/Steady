# Build profile for the MCU half of this App Lab app.
# App Lab writes this file when you add libraries; if your installed core differs
# from the FQBN below, let App Lab regenerate it and keep the library list.
default_profile: unoq
profiles:
  unoq:
    fqbn: arduino:zephyr:unoq
    platforms:
      - platform: arduino:zephyr
    libraries:
      - Arduino_RouterBridge
      # Optional: a worker verifies their visit by tapping a tag on the wearable. No
      # reader is fitted yet, so the sketch builds without it - the NFC block is
      # compiled out and taps come from the relay's dummy mode or the simulator.
      # Not fitted: install "Adafruit PN532" in App Lab to enable the NFC block.
      # Leaving this out keeps the build working; the sketch compiles NFC out.
